<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer rotating hexagon -->
  <g>
    <polygon points="100,20 170,60 170,140 100,180 30,140 30,60" 
             stroke="#623686" stroke-width="2" fill="none" opacity="0.5">
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        from="0 100 100" 
        to="360 100 100" 
        dur="10s" 
        repeatCount="indefinite" />
    </polygon>
  </g>
  
  <!-- Middle rotating hexagon -->
  <g>
    <polygon points="100,40 150,70 150,130 100,160 50,130 50,70" 
             stroke="#623686" stroke-width="2" fill="none" opacity="0.7">
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        from="0 100 100" 
        to="-360 100 100" 
        dur="8s" 
        repeatCount="indefinite" />
    </polygon>
  </g>
  
  <!-- Inner rotating hexagon -->
  <g>
    <polygon points="100,60 130,80 130,120 100,140 70,120 70,80" 
             stroke="#623686" stroke-width="2" fill="none" opacity="0.9">
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        from="0 100 100" 
        to="360 100 100" 
        dur="6s" 
        repeatCount="indefinite" />
    </polygon>
  </g>
  
  <!-- Pulsing center circle -->
  <circle cx="100" cy="100" r="15" fill="#623686">
    <animate 
      attributeName="r" 
      values="15;20;15" 
      dur="2s" 
      repeatCount="indefinite" />
    <animate 
      attributeName="opacity" 
      values="1;0.8;1" 
      dur="2s" 
      repeatCount="indefinite" />
  </circle>
  
  <!-- Orbiting particles -->
  <g>
    <circle cx="100" cy="60" r="4" fill="#623686">
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        from="0 100 100" 
        to="360 100 100" 
        dur="3s" 
        repeatCount="indefinite" />
    </circle>
    
    <circle cx="140" cy="100" r="4" fill="#623686">
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        from="90 100 100" 
        to="450 100 100" 
        dur="3s" 
        repeatCount="indefinite" />
    </circle>
    
    <circle cx="100" cy="140" r="4" fill="#623686">
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        from="180 100 100" 
        to="540 100 100" 
        dur="3s" 
        repeatCount="indefinite" />
    </circle>
    
    <circle cx="60" cy="100" r="4" fill="#623686">
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        from="270 100 100" 
        to="630 100 100" 
        dur="3s" 
        repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Connecting lines with dash animation -->
  <g stroke="#623686" stroke-width="1" opacity="0.6">
    <line x1="100" y1="40" x2="100" y2="60">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
    </line>
    <line x1="150" y1="70" x2="130" y2="80">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="0.5s" />
    </line>
    <line x1="150" y1="130" x2="130" y2="120">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1s" />
    </line>
    <line x1="100" y1="160" x2="100" y2="140">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1.5s" />
    </line>
    <line x1="50" y1="130" x2="70" y2="120">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="0.5s" />
    </line>
    <line x1="50" y1="70" x2="70" y2="80">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1s" />
    </line>
  </g>
  
  <!-- Pulsing dots at vertices -->
  <g fill="#623686">
    <circle cx="100" cy="40" r="3">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="150" cy="70" r="3">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" begin="0.33s" />
    </circle>
    <circle cx="150" cy="130" r="3">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" begin="0.66s" />
    </circle>
    <circle cx="100" cy="160" r="3">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" begin="1s" />
    </circle>
    <circle cx="50" cy="130" r="3">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" begin="1.33s" />
    </circle>
    <circle cx="50" cy="70" r="3">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" begin="1.66s" />
    </circle>
  </g>
  
  <!-- Subtle background glow -->
  <circle cx="100" cy="100" r="80" fill="url(#glow)" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.3;0.2" dur="4s" repeatCount="indefinite" />
  </circle>
  
  <!-- Gradient definition -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#623686" stop-opacity="1" />
      <stop offset="100%" stop-color="#623686" stop-opacity="0" />
    </radialGradient>
  </defs>
</svg>